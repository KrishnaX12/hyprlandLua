# Neutral charcoal theme
background {
    monitor =
    color = rgba(181a1bff)
}

general {
    hide_cursor = true
    ignore_empty_input = true
}

input-field {
    monitor =
    size = 300, 56
    outline_thickness = 1
    outer_color = rgba(454b4fff)
    inner_color = rgba(242729ff)
    font_color = rgba(e6e6e6ff)
    font_family = JetBrainsMono Nerd Font
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    rounding = 12
    fade_on_empty = false
    check_color = rgba(939a9eff)
    fail_color = rgba(ea6962ff)
    capslock_color = rgba(d8a657ff)
    placeholder_text = Password
    fail_text = Try again
    hide_input = false
    position = 0, -140
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(e6e6e6ff)
    font_size = 88
    font_family = JetBrainsMono Nerd Font
    position = 0, 95
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(b0b5b8ff)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, -5
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(939a9eff)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, -85
    halign = center
    valign = center
}
